[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abt"
version = "0.1.0"
description = "Multi-bot Telegram agent gateway for Claude, Codex, and PI.dev backends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.1.0,<0.2",
    # In-process SDK MCP tools need mcp 1.x; the 2.0 alpha drops Server.list_tools.
    "mcp>=1.19,<2",
    # Used directly by the Graphiti memory proxy to set a Host override header;
    # also an mcp transitive dep.
    "httpx>=0.27,<1",
    "openai-codex>=0.1.0b3,<0.2",
    "aiogram>=3.29,<4",
    "aiohttp>=3.9,<4",
    "markdown-it-py>=3.0,<5",
    "mdit-py-plugins>=0.4,<1",
    "pydantic>=2.0,<3",
    "PyYAML>=6.0,<7",
    "croniter>=2.0,<7",
]

[project.scripts]
abt = "src.bot:_cli"

[dependency-groups]
dev = [
    # Exact pin: the lint config below selects preview rules by code.
    "ruff==0.16.6",
    "mypy>=2.3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-PyYAML",
    "types-croniter",
]

[tool.uv]
python-preference = "only-managed"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
cache-dir = "var/cache/ruff"
# 100 instead of the default 88: SDK-typed signatures and aiogram handler
# annotations wrap badly at 88.
line-length = 100
force-exclude = true
extend-exclude = [".agents"]
# `src` is not set: the package itself is named `src`, and ruff's default
# (`[".", "src"]`) already resolves `src.*` as first-party.

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "F", "E4", "E7", "E9",
    "B", "RUF", "PIE", "PGH004",
    "S", "ASYNC", "DTZ",
    "BLE", "TRY", "RSE", "RET",
    "LOG", "G",
    "ARG", "SLF", "A", "N",
    "PLE", "PLW",
    "PT", "PTH", "T20",
    "D", "ANN",
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502",
    "ERA", "TD",
    "I", "UP", "C4", "SIM", "PERF", "FURB", "TC",
]
ignore = [
    "D105",    # magic methods: the name is the contract
    "D107",    # __init__: documented in the class docstring
    "TRY003",  # long messages in raise are fine without EM selected
    "RUF001",  # ambiguous unicode: test fixtures contain Russian text,
    "RUF002",  # so Cyrillic letters are the norm, not a homoglyph attack
    "RUF003",
    "TD002",   # TODO author: this project has one
    "TD003",   # TODO issue link: there is no tracker to link to
    # Project adaptations, see .agents/decisions/.
    "ANN401",  # `Any` at the SDK / JSON boundaries is the real type there
    "BLE001",  # Handlers log via injected per-chat loggers (`cl`, `ctx.glog`)
               # that ruff cannot recognise as loggers; every blind
               # `except Exception` here logs with a traceback or degrades
               # on purpose (best-effort Telegram calls, fallbacks).
    "TC001",   # On 3.14 annotations are lazy (PEP 649); moving typing-only
    "TC002",   # imports under TYPE_CHECKING buys nothing and breaks dataclass
    "TC003",   # and pydantic field introspection.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py"      = ["D", "DOC", "ANN", "S101", "ARG", "SLF"]
"src/**/__init__.py" = ["D104"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
cache_dir = "var/cache/mypy"
strict = true
warn_unreachable = true
warn_unused_configs = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
cache_dir = "var/cache/pytest"
